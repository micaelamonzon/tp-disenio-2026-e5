spring.application.name=autenticacion-service
server.port=8085
service.notificaciones.url=http://localhost:8081

# Base propia del servicio
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MISMA clave que usa el front para leer los tokens
jwt.secret=${JWT_SECRET:clave-provisoria-debe-tener-32-caracteres-o-mas-----------------}

# Admin inicial (se crea al arrancar si no existe)
admin.email=${ADMIN_EMAIL:admin@donatrack.org}
admin.password=${ADMIN_PASSWORD:cambiar-esta-clave}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# API token con el que autenticación se identifica ante notificaciones (header X-Api-Token)
api.token=${API_TOKEN_AUTENTICACION:dev-autenticacion-tokeb}

spring.rabbitmq.addresses=${Rabbit_URL}
notificaciones.queue.name=cola-notificaciones
