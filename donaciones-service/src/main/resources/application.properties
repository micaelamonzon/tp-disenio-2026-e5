server.port=8080
spring.application.name=donaciones-service
spring.threads.virtual.enabled=true
service.notificaciones.url=http://localhost:8081
match.a1=0.40
match.a2=0.40
match.a3=0.20
alpha=0.1
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
incentivos.service.url=http://localhost:8082
# url.normalizar=https://servicios.usig.buenosaires.gob.ar/normalizar/
url.convertir=https://ws.usig.buenosaires.gob.ar/rest/convertir_coordenadas
# Misma clave que autenticacion-service y el front: con ella se verifica la firma de los tokens
jwt.secret=${JWT_SECRET:clave-provisoria-debe-tener-32-caracteres-o-mas-----------------}
# API tokens de los servicios que pueden llamar a donaciones (header X-Api-Token).
api.tokens.logistica=${API_TOKEN_LOGISTICA:dev-logistica-token}

spring.rabbitmq.addresses=${rabbit_URL}
notificaciones.queue.name=cola-notificaciones
# API token con el que donaciones se identifica ante otros servicios (header X-Api-Token)
api.token=${API_TOKEN_DONACIONES:dev-donaciones-token}
api.tokens.notificaciones=${API_TOKEN_NOTIFICACIONES:dev-notificaciones-token}
