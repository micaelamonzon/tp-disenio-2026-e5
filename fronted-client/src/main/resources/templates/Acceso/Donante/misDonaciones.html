<html th:replace="~{layout/base ::html}">
<div th:fragment="contenido" class="row">
    <section id="view-donaciones" class="view active">
        <div class="page-head">
            <h1>Mis Donaciones</h1>
            <p class="page-sub">Gestiona y realiza seguimiento de todas tus donaciones</p>
        </div>

        <div class="filters-card">
            <div class="filters-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                Filtros Avanzados
            </div>
            <div class="filters-grid">
                <label class="field">
                    <span>Estado</span>
                    <select id="filterEstado">
                        <option value="todos">Todos</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Asignada">Asignada</option>
                        <option value="Recibida">Recibida</option>
                    </select>
                </label>
                <label class="field">
                    <span>Categoría</span>
                    <select id="filterCategoria">
                        <option value="todas">Todas</option>
                    </select>
                </label>
                <label class="field">
                    <span>Subcategoría</span>
                    <select id="filterSubcategoria">
                        <option value="todas">Todas</option>
                    </select>
                </label>
            </div>
        </div>

        <p class="results-count" id="resultsCount">Mostrando 8 donaciones</p>

        <div class="donations-grid" id="donationsGrid"></div>
        <p class="empty-state" id="donationsEmpty" hidden>No se encontraron donaciones con esos filtros. Probá ajustar el estado, la categoría o la subcategoría.</p>
    </section>
    <script src="../../../static/js/donante.js"></script>
 </div>
</html>
