<html th:replace="~{layoutEntidad/base :: html}">
    <div th:fragment="contenido" class="row">
        <section id="view-estado-necesidades">
            <div class="page-head">
                <h1>Estado de Donaciones</h1>
                <p class="page-sub">En está sección podrá ver el estado de sus donaciones</p>
            </div>
            <div class="estado-necesidades-container">
                <div class="status-list-container" id="statusNeedsList">

                    <div th:if="${errorDonaciones}" class="alert alert-danger" th:text="${errorDonaciones}"></div>

                    <p th:if="${#lists.isEmpty(donaciones) and errorDonaciones == null}" class="page-sub">
                        Todavía no tenés donaciones asignadas.
                    </p>

                    <article class="status-card" th:each="d : ${donaciones}">
                        <div class="status-card-left">
                        <span th:replace="${d.donacionEntregada == true}
                                ? ~{fragments/iconosDeEstado :: iconoEntregado}
                                : ~{fragments/iconosDeEstado :: iconoPendiente}"></span>

                            <div class="status-card-info">
                                <h3 th:text="${d.subcategoria}">Subcategoría</h3>
                                <p class="status-card-sub" th:text="${d.descripcion} + '.'"></p>
                                <div class="status-card-details">
                                    <span th:text="'Cantidad: ' + ${d.cantidad}"></span>
                                    <span th:text="${d.hace}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="status-card-right">
        <span class="status-tag"
              th:classappend="${d.donacionEntregada == true} ? 'status-entregado' : 'status-pendiente'"
              th:text="${d.donacionEntregada == true} ? 'Entregado' : 'Pendiente'">Pendiente</span>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </div>
</html>
