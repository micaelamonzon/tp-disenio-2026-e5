<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - DonaTrack</title>
    <link rel="stylesheet" th:href="@{/css/landingPage/landingPage.css}">
</head>
<body>
<main class="page">
    <div class="form-container" style="max-width: 420px; margin: 4rem auto; background: #fff; padding: 2rem; border-radius: 16px;">
        <h2>Nueva Contraseña</h2>
        <form th:action="@{/acceso/nueva-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div th:if="${error != null}" style="color: red; margin-bottom: 1rem;" th:text="${error}"></div>
            <div style="margin-bottom: 1rem;">
                <label for="nuevaPassword">Ingresá tu nueva contraseña:</label>
                <input type="password" id="nuevaPassword" name="nuevaPassword" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px;">Guardar</button>
        </form>
    </div>
</main>
</body>
</html>
