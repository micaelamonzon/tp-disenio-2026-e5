<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - DonaTrack'">No encontrado - DonaTrack</title>
    <link rel="stylesheet" th:href="@{/css/landingPage/landingPage.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f8fafc; color: #334155; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem;">

<main style="width: 100%; max-width: 600px; text-align: center;">

    <div style="background: #ffffff; padding: 3rem 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;">

        <!-- Ícono de Advertencia -->
        <div style="color: #f59e0b; margin-bottom: 1.5rem;">
            <i class="fas fa-exclamation-triangle fa-3x"></i>
        </div>

        <h1 style="font-size: 2.25rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem;">
            <span th:text="${titulo}">No encontrado</span>
        </h1>

        <p style="color: #64748b; font-size: 1.05rem; margin: 0 auto 2rem auto; line-height: 1.5;">
            Lo sentimos, la página o recurso que estás buscando no existe o ha sido movido.
        </p>

        <!-- Botones de Acción Principales -->
        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.5rem;">
            <!-- Botón inteligente según sesión y rol -->
            <a th:href="${session.usuario != null} ? (${#strings.containsIgnoreCase(session.usuario.rol, 'administrador')} ? @{/personaAdministradora/home} : @{/donante/misDonaciones}) : @{/acceso/landing}"
               style="background-color: #2563eb; color: #ffffff; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: background 0.2s;">
                <i class="fas fa-home"></i> Ir al Inicio
            </a>
            <button onclick="history.back()" style="background-color: transparent; color: #2563eb; border: 1px solid #2563eb; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s;">
                <i class="fas fa-arrow-left"></i> Volver Atrás
            </button>
        </div>

        <!-- Sección de Ayuda / ¿Qué puedes hacer? -->
        <div style="border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
            <h5 style="color: #475569; font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem;">¿Qué puedes hacer?</h5>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; text-align: left;">

                <div style="background: #f8fafc; padding: 0.85rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                        <i class="fas fa-search" style="color: #2563eb; font-size: 0.9rem;"></i>
                        <h6 style="font-size: 0.85rem; font-weight: 700; color: #1e293b; margin: 0;">Verificar URL</h6>
                    </div>
                    <small style="color: #64748b; font-size: 0.75rem; display: block;">Revisa la dirección</small>
                </div>

                <div style="background: #f8fafc; padding: 0.85rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                        <i class="fas fa-arrow-left" style="color: #16a34a; font-size: 0.9rem;"></i>
                        <h6 style="font-size: 0.85rem; font-weight: 700; color: #1e293b; margin: 0;">Volver Atrás</h6>
                    </div>
                    <small style="color: #64748b; font-size: 0.75rem; display: block;">Usa el navegador</small>
                </div>

                <div style="background: #f8fafc; padding: 0.85rem; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                        <i class="fas fa-home" style="color: #0ea5e9; font-size: 0.9rem;"></i>
                        <h6 style="font-size: 0.85rem; font-weight: 700; color: #1e293b; margin: 0;">Ir al Inicio</h6>
                    </div>
                    <small style="color: #64748b; font-size: 0.75rem; display: block;">Página principal</small>
                </div>

            </div>
        </div>

    </div>
</main>

</body>
</html>
