server.port=8082
spring.application.name=incentivos-service
spring.threads.virtual.enabled=true
service.donaciones.url=http://localhost:8080/servicioDeDonaciones
n8n.base-url={N8N_URL}

service.notificaciones.url=http://localhost:8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.rabbitmq.addresses={Rabbit_URL}
notificaciones.queue.name=cola-notificaciones

jwt.secret=${JWT_SECRET:clave-provisoria-debe-tener-32-caracteres-o-mas-----------------}
# API tokens de los servicios que pueden llamar a incentivos
api.tokens.donaciones=${API_TOKEN_DONACIONES:dev-donaciones-token}
