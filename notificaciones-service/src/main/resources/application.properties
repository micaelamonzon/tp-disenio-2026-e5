server.port=8081
spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true

twilio.account.sid=${token}
twilio.auth.token=${token}
twilio.from.number=${numero}
twilio.whatsapp.number=+${numero}
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${email}

spring.rabbitmq.addresses=${URL_RABBITMQ}
notificaciones.queue.name=cola-notificaciones

#spring.datasource.url=jdbc:mysql://localhost:3306/db_notificaciones?useSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:clave-provisoria-debe-tener-32-caracteres-o-mas-----------------}
# Email: proveedor a usar (smtp = Gmail, sendgrid = SendGrid)
notificaciones.email.proveedor=smtp

# Gmail por SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=${PORT}
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.username=${mail_USERNAME}
spring.mail.password=${PASSWORD}
spring.mail.properties.mail.smtp.auth=true

# API tokens de los servicios que pueden llamar a notificaciones
api.tokens.donaciones=${API_TOKEN_DONACIONES:dev-donaciones-token}
api.tokens.autenticacion=${API_TOKEN_AUTENTICACION:dev-autenticacion-token}
# API token con el que notificaciones se identifica ante donaciones
api.token=${API_TOKEN_NOTIFICACIONES:dev-notificaciones-token}
